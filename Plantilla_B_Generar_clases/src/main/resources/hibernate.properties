# CAMBIA: estos datos son los mismos que en el plugin del pom.xml, tienen que coincidir
# Driver. MariaDB = org.mariadb.jdbc.Driver   MySQL = com.mysql.cj.jdbc.Driver
hibernate.connection.driver_class=org.mariadb.jdbc.Driver
# URL con el nombre de la base de datos
hibernate.connection.url=jdbc:mariadb://localhost:3306/NOMBRE_BD
# Usuario y contrasena
hibernate.connection.username=profe
hibernate.connection.password=abc123
# Dialecto. MariaDB = org.hibernate.dialect.MariaDBDialect   MySQL = org.hibernate.dialect.MySQLDialect
hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Nombre de la base de datos en las dos lineas
hibernate.default_catalog=NOMBRE_BD
hibernate.default_schema=NOMBRE_BD
